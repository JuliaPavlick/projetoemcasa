<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refrigerantes</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <div class="item active" style="--background: #EA3D41">
            <div class="title">Morango</div>
            <img src="./img/morango.png" class="fruta" alt="Morango">
            <img src="./img/morango-refrigerante.png" class="refri" alt="Refrigerante de Morango">
        </div>

        <div class="item" style="--background: #2D5643">
            <div class="title">Abacate</div>
            <img src="./img/abacate.png" class="fruta" alt="Abacate">
            <img src="./img/abacate-refrigerante.png" class="refri" alt="Refrigerante de Abacate">
        </div>

        <div class="item" style="--background: #E7A043">
            <div class="title">Laranja</div>
            <img src="./img/laranja.png" class="fruta" alt="Laranja">
            <img src="./img/laranja-refrigerante.png" class="refri" alt="Refrigerante de Laranja">
        </div>

        <div class="arrow">
            <button id="prev">‹</button>
            <button id="next">›</button>
        </div>
    </main>
    <script src="./js/validacoes.js"></script>
</body>
</html>
