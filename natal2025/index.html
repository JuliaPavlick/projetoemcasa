<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Memórias de Natal 🎄</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="./scr/css/style.css">
</head>
<body>

  <!-- CAIXA DE PRESENTE -->
  <div class="gift" id="gift">
    <div class="lid"></div>
    <div class="bow-container">
  <svg viewBox="0 0 600 400" class="bow-svg">
    <defs>
      <!-- Gradiente principal -->
      <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff5a5a"/>
        <stop offset="45%" stop-color="#d60000"/>
        <stop offset="100%" stop-color="#8b0000"/>
      </linearGradient>

      <!-- Brilho -->
      <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </linearGradient>

      <!-- Sombra -->
      <filter id="softShadow">
        <feDropShadow dx="0" dy="12" stdDeviation="20" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- Laço esquerdo -->
    <path
      d="M300 180
         C120 60, 90 280, 260 230
         C230 210, 230 190, 300 180 Z"
      fill="url(#redGrad)"
      filter="url(#softShadow)"
    />

    <!-- Laço direito -->
    <path
      d="M300 180
         C480 60, 510 280, 340 230
         C370 210, 370 190, 300 180 Z"
      fill="url(#redGrad)"
      filter="url(#softShadow)"
    />

    <!-- Brilho esquerdo -->
    <path
      d="M220 120 C150 150, 150 210, 240 200"
      stroke="url(#shineGrad)"
      stroke-width="14"
      fill="none"
      opacity="0.7"
    />

    <!-- Brilho direito -->
    <path
      d="M380 120 C450 150, 450 210, 360 200"
      stroke="url(#shineGrad)"
      stroke-width="14"
      fill="none"
      opacity="0.7"
    />

    <!-- Nó central -->
    <rect x="270" y="155" width="60" height="70" rx="18"
      fill="#b30000"
      filter="url(#softShadow)"
    />

    <!-- Brilho no nó -->
    <ellipse cx="300" cy="170" rx="18" ry="10"
      fill="rgba(255,255,255,0.6)"
    />

    <!-- Pontas -->
    <path d="M260 230 L190 360 L260 330 Z" fill="url(#redGrad)"/>
    <path d="M340 230 L410 360 L340 330 Z" fill="url(#redGrad)"/>
  </svg>
</div>

  </div>

  <!-- LINHA DO TEMPO -->
  <div class="timeline" id="timeline">

    <div class="slide">
      <img src="imagens/natal2024.jpg" alt="Natal">
      <h2>Natal 2024 🎄</h2>
      <p>Um Natal cheio de risadas, comida boa e amor.</p>
    </div>

    <div class="slide">
      <img src="imagens/pascoa.jpg" alt="Páscoa">
      <h2>Páscoa 🐰</h2>
      <p>Chocolate, bagunça e família reunida.</p>
    </div>

    <div class="slide">
      <img src="imagens/aniversario1.jpg" alt="Aniversário">
      <h2>Aniversário 🎉</h2>
      <p>Mais um ano de histórias pra contar.</p>
    </div>

  </div>

  <script src="./scr/js/script.js"></script>
</body>
</html>
